[package]
name = "hyperlight-tray"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Lightweight open-source battery tray app for the Hitscan Hyperlight mouse"
readme = "README.md"
build = "build.rs"

[lib]
name = "hyperlight"
path = "src/lib.rs"

[[bin]]
name = "hyperlight-tray"
path = "src/main.rs"

[[bin]]
name = "hyperlight-probe"
path = "src/bin/probe.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Networking_WinHttp",
]

# Direct2D/DirectWrite (COM) for the tray menu's text rendering.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
